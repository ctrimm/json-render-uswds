name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: input
    id: description
    attributes:
      label: What happened?
      placeholder: A clear one-line summary of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or steps to reproduce the issue
      render: tsx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.1.0
    validations:
      required: true
